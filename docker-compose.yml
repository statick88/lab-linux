# =============================================================================
# Docker Compose - Laboratorio Linux
# =============================================================================
# Levanta el contenedor interactivo del laboratorio.
#
# Uso:
#   docker compose up -d          # Levantar en segundo plano
#   docker compose exec lab-linux bash  # Entrar al contenedor
#   docker compose down           # Detener y eliminar
# =============================================================================

services:
  lab-linux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mi-lab-linux
    stdin_open: true    # Mantener stdin abierto (-i)
    tty: true           # Asignar pseudo-TTY (-t)
    privileged: true
    volumes:
      - lab-data:/home/estudiante/laboratorio
      - ./resultados:/home/estudiante/laboratorio/resultados
      - /var/run/docker.sock:/var/run/docker.sock
      # - lab-metrics:/home/estudiante/.lab_metrics  # Descomentar para persistir metricas entre sesiones
    environment:
      - LAB_NAME=Fundamentos de Linux
      - STUDENT_USER=estudiante
      - STUDENT_PASS=lab123
      - FRASE_OCULTA=Toda revolution comienza con un pass Los administradores nunca duermen !
    restart: unless-stopped

volumes:
  lab-data:
    driver: local
  # lab-metrics:
  #   driver: local
